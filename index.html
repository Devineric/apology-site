<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>💗珂儿，对不起，原谅我好吗</title>
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 50%, #ff9a9e 100%);
            background-attachment: fixed; overflow: hidden; padding: 1rem; position: relative;
        }
        .hearts-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .heart-particle { position: absolute; font-size: 1.2rem; animation: floatHeart linear infinite; opacity: 0.5; user-select: none; }
        @keyframes floatHeart {
            0%   { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10%  { opacity: 0.6; }
            90%  { opacity: 0.6; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }
        .card {
            position: relative; z-index: 1; max-width: 520px; width: 100%;
            background: rgba(255,255,255,0.88); backdrop-filter: blur(12px);
            border-radius: 28px; padding: 2rem 2rem 2rem;
            box-shadow: 0 20px 60px rgba(0,0,0,0.12), 0 8px 24px rgba(255,120,120,0.15);
            text-align: center; transition: all 0.5s ease;
        }
        .card__avatar { font-size: 4rem; margin-bottom: 0.25rem; display: block; animation: bounce 2s ease-in-out infinite; }
        @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .card__letter {
            background: rgba(255,230,235,0.5); border-radius: 16px; padding: 1.5rem 1.2rem;
            margin-bottom: 1.8rem; text-align: left; line-height: 1.9;
            color: #5a3e3e; font-size: 0.98rem; border: 1px solid rgba(255,150,170,0.2);
        }
        .card__letter p { margin-bottom: 0.8rem; }
        .card__letter p:last-child { margin-bottom: 0; }
        .btn-group { display: flex; gap: 1rem; justify-content: center; align-items: center; flex-wrap: wrap; min-height: 60px; position: relative; }
        .btn {
            font-family: "ZCOOL KuaiLe", "Noto Sans SC", sans-serif;
            font-size: 1.1rem; padding: 0.75rem 2rem; border: none; border-radius: 50px;
            cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
            user-select: none; -webkit-tap-highlight-color: transparent; white-space: nowrap;
        }
        .btn--yes { background: linear-gradient(135deg, #ff6b8a, #d6336c); color: #fff; box-shadow: 0 4px 16px rgba(214,51,108,0.35); }
        .btn--yes:hover { transform: scale(1.06); box-shadow: 0 6px 24px rgba(214,51,108,0.45); }
        .btn--no { position: relative; background: #f0f0f0; color: #888; box-shadow: 0 2px 8px rgba(0,0,0,0.06); transition: left 0.12s ease, top 0.12s ease; }
        .card.forgiven .initial-state { display: none; }
        .card.forgiven .celebration { display: block; }
        .card.submitted .celebration { display: none; }
        .card.submitted .delivering { display: flex; }
        .celebration { display: none; animation: fadeInUp 0.8s ease forwards; }
        .celebration h2 { font-family: "ZCOOL KuaiLe", "Noto Sans SC", sans-serif; font-size: 1.7rem; color: #d6336c; margin: 0 0 0.3rem; }
        .celebration__subtitle { color: #7a4a4a; font-size: 1rem; line-height: 1.6; margin-bottom: 1.3rem; }
        .choices { display: flex; gap: 0.7rem; justify-content: center; flex-wrap: wrap; margin-bottom: 1rem; }
        .choice-btn {
            font-family: "Noto Sans SC", sans-serif; font-size: 0.95rem;
            padding: 0.7rem 1rem; border: 2px solid rgba(214,51,108,0.15);
            border-radius: 14px; background: rgba(255,255,255,0.6);
            color: #5a3e3e; cursor: pointer; transition: all 0.25s;
            flex: 1; min-width: 100px; line-height: 1.3;
        }
        .choice-btn:hover { border-color: #d6336c; background: rgba(214,51,108,0.04); }
        .choice-btn.selected {
            border-color: #d6336c; background: linear-gradient(135deg, #ff6b8a, #d6336c);
            color: #fff; box-shadow: 0 4px 16px rgba(214,51,108,0.3); transform: scale(1.03);
        }
        #messageInput {
            width: 100%; padding: 0.9rem 1rem;
            border: 2px solid rgba(214,51,108,0.12); border-radius: 14px;
            font-family: "Noto Sans SC", sans-serif; font-size: 0.9rem;
            color: #3d2a2a; resize: none; outline: none;
            transition: border-color 0.25s; background: rgba(255,255,255,0.5);
            margin-bottom: 1rem; line-height: 1.6;
        }
        #messageInput:focus { border-color: #d6336c; }
        #messageInput::placeholder { color: #bbb; }
        .btn--confirm {
            background: linear-gradient(135deg, #ff6b8a, #d6336c); color: #fff;
            box-shadow: 0 4px 16px rgba(214,51,108,0.35); width: 100%;
            font-size: 1.15rem; padding: 0.85rem;
        }
        .btn--confirm:hover { transform: scale(1.03); box-shadow: 0 6px 24px rgba(214,51,108,0.45); }
        .btn--confirm:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }
        .delivering { display: none; flex-direction: column; align-items: center; animation: fadeInUp 0.8s ease forwards; }
        .delivering .card__avatar { font-size: 5rem; }
        .delivering h2 { font-family: "ZCOOL KuaiLe", "Noto Sans SC", sans-serif; font-size: 1.5rem; color: #d6336c; margin: 0.3rem 0 0.5rem; }
        .delivering__sub { color: #7a4a4a; font-size: 0.95rem; line-height: 1.6; }
        @keyframes fadeInUp { 0% { opacity: 0; transform: translateY(20px); } 100% { opacity: 1; transform: translateY(0); } }
        .confetti-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        .confetti-piece { position: absolute; top: -30px; animation: confettiFall linear forwards; font-size: 1.5rem; user-select: none; }
        @keyframes confettiFall { 0% { transform: translateY(0) rotate(0deg); opacity: 1; } 100% { transform: translateY(110vh) rotate(720deg); opacity: 0; } }
        @media (max-width: 480px) {
            .card { padding: 1.5rem 1.2rem 1.5rem; }
            .card__letter { font-size: 0.9rem; padding: 1.2rem 1rem; }
            .btn { font-size: 0.95rem; padding: 0.6rem 1.5rem; }
            .card__avatar { font-size: 3.2rem; }
            .choice-btn { font-size: 0.85rem; padding: 0.6rem 0.5rem; min-width: 80px; }
            .celebration h2 { font-size: 1.4rem; }
            .delivering h2 { font-size: 1.2rem; }
        }
    </style>
</head>
<body>
    <div class="hearts-bg" id="heartsBg"></div>
    <div class="card" id="card">
        <div class="initial-state" id="initialState">
            <span class="card__avatar">🥺</span>
            <div class="card__letter">
                <p>宝，我知道错了，</p>
                <p>我知道宝情绪还在，最近两天晚上宝都没有看抖音了，宝回复的我也能感觉到</p>
                <p>这是做的一个专属的小网站，<br>不求别的，只求图你一笑，<br>希望宝能原谅我。</p>
                <p style="text-align:right;">—— 泉 ❤️</p>
            </div>
            <div class="btn-group" id="btnGroup">
                <button class="btn btn--yes" id="btnYes">原谅你啦 ❤️</button>
                <button class="btn btn--no" id="btnNo">就不原谅 😤</button>
            </div>
        </div>
        <div class="celebration" id="celebration">
            <h2>我就知道珂儿最好了！❤️</h2>
            <p class="celebration__subtitle">这是我的诚意宝，你务必收下</p>
            <div class="choices" id="choices">
                <button class="choice-btn" data-value="奶茶">宝喜欢的一杯奶茶 🧋</button>
                <button class="choice-btn" data-value="蛋糕">一个小蛋糕 🍰</button>
                <button class="choice-btn" data-value="红包">一个🧧</button>
            </div>
            <textarea id="messageInput" rows="3" placeholder="或者写下你想对我说的话，或想要的别的东西～"></textarea>
            <button class="btn btn--confirm" id="btnConfirm" disabled>确定</button>
        </div>
        <div class="delivering" id="delivering">
            <span class="card__avatar">🏃💨</span>
            <h2>正在马不停蹄为你赶来～</h2>
            <p class="delivering__sub">宝的礼物安排上了，请稍候片刻 💕</p>
        </div>
    </div>
    <div class="confetti-container" id="confettiContainer"></div>
    <script>
        const heartsBg = document.getElementById("heartsBg");
        const hs = ["💕","❤️","💗","💖","🌸","✨"];
        for (let i = 0; i < 24; i++) {
            const el = document.createElement("span");
            el.className = "heart-particle";
            el.textContent = hs[i % hs.length];
            el.style.left = Math.random() * 100 + "%";
            el.style.fontSize = (0.8 + Math.random() * 1.2) + "rem";
            el.style.animationDuration = (10 + Math.random() * 18) + "s";
            el.style.animationDelay = Math.random() * 20 + "s";
            heartsBg.appendChild(el);
        }
        const btnNo = document.getElementById("btnNo");
        const btnYes = document.getElementById("btnYes");
        const card = document.getElementById("card");
        const confettiContainer = document.getElementById("confettiContainer");
        const choiceBtns = document.querySelectorAll(".choice-btn");
        const messageInput = document.getElementById("messageInput");
        const btnConfirm = document.getElementById("btnConfirm");
        let selectedChoice = null;
        fetch("/api/visit", { method: "POST" }).catch(function(){});
        const taunts = [
            "抓不到我吧～ 😝", "你就原谅他嘛～", "哎哟～差一点！",
            "放弃吧～ 😎", "点这里没用哦～", "略略略～ 🐱",
            "你追不上我～", "原谅他吧！求你了！", "嘿嘿嘿 😏", "跑跑跑～ 🏃"
        ];
        function fleeButton(e) {
            if (card.classList.contains("forgiven")) return;
            const btn = btnNo;
            const btnW = btn.offsetWidth, btnH = btn.offsetHeight;
            const margin = 20;
            const maxX = document.documentElement.clientWidth - btnW - margin;
            const maxY = document.documentElement.clientHeight - btnH - margin;
            let newX, newY;
            const minX = margin, minY = margin;
            let tries = 0;
            if (e && e.clientX !== undefined) {
                const cx = e.clientX, cy = e.clientY;
                do {
                    newX = minX + Math.random() * (maxX - minX);
                    newY = minY + Math.random() * (maxY - minY);
                    tries++;
                } while (tries < 30 && Math.abs(newX + btnW / 2 - cx) < 150 && Math.abs(newY + btnH / 2 - cy) < 150);
            } else {
                newX = minX + Math.random() * (maxX - minX);
                newY = minY + Math.random() * (maxY - minY);
            }
            newX = Math.max(minX, Math.min(maxX, newX));
            newY = Math.max(minY, Math.min(maxY, newY));
            btn.style.position = "fixed";
            btn.style.left = newX + "px";
            btn.style.top = newY + "px";
            btn.style.zIndex = "999";
            tauntIndex++;
            btn.textContent = taunts[tauntIndex % taunts.length];
            const shrink = Math.max(0.25, 1 - tauntIndex * 0.018);
            btn.style.transform = "scale(" + shrink + ")";
            btn.style.transformOrigin = "center center";
            const grow = Math.min(1.25, 1 + tauntIndex * 0.005);
            btnYes.style.transform = "scale(" + grow + ")";
        }
        btnNo.addEventListener("mouseenter", fleeButton);
        btnNo.addEventListener("touchstart", function(e) { e.preventDefault(); fleeButton(e.touches[0]); }, { passive: false });
        btnNo.addEventListener("click", function(e) { e.preventDefault(); fleeButton(e); });
        btnYes.addEventListener("click", function() {
            if (card.classList.contains("forgiven")) return;
            card.classList.add("forgiven");
            btnNo.style.position = ""; btnNo.style.left = ""; btnNo.style.top = ""; btnNo.style.zIndex = ""; btnNo.style.transform = "";
            launchConfetti();
        });
        for (let i = 0; i < choiceBtns.length; i++) {
            choiceBtns[i].addEventListener("click", function() {
                for (let j = 0; j < choiceBtns.length; j++) choiceBtns[j].classList.remove("selected");
                this.classList.add("selected");
                selectedChoice = this.getAttribute("data-value");
                btnConfirm.disabled = false;
            });
        }
        btnConfirm.addEventListener("click", function() {
            if (!selectedChoice) return;
            btnConfirm.disabled = true;
            btnConfirm.textContent = "发送中...";
            fetch("/api/submit", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ choice: selectedChoice, message: messageInput.value.trim() })
            }).then(function() {
                card.classList.add("submitted");
                launchConfetti();
            }).catch(function() {
                card.classList.add("submitted");
                launchConfetti();
            });
        });
        function launchConfetti() {
            const symbols = ["❤️","💕","💗","💖","🌸","🎉","🥳","✨","🎊","💝"];
            for (let i = 0; i < 60; i++) {
                const el = document.createElement("span");
                el.className = "confetti-piece";
                el.textContent = symbols[i % symbols.length];
                el.style.left = Math.random() * 100 + "%";
                el.style.fontSize = (1 + Math.random() * 2) + "rem";
                el.style.animationDuration = (2.5 + Math.random() * 3) + "s";
                el.style.animationDelay = Math.random() * 1.5 + "s";
                confettiContainer.appendChild(el);
            }
            setTimeout(function() { confettiContainer.innerHTML = ""; }, 6000);
        }
    </script>
</body>
</html>
